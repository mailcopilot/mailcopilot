# GitHub Actions workflow for building the Windows NSIS installer.
# Triggered remotely from GitLab CI tag pipeline via workflow_dispatch API.
# The GitLab job pushes clean source code + tag to this repo, then triggers this workflow.
#
# Why GitHub Actions instead of the in-RF GitLab runner: windows-latest runs
# outside RF, so it reaches electronjs.org/headers (node-gyp headers/node.lib for
# the better-sqlite3 native rebuild) natively — no npmmirror mirrors needed. The
# old GitLab self-hosted Windows runner sat behind RF DPI throttling that blocks
# those headers, which is why it was allow_failure. windows-latest also ships
# Python preinstalled for node-gyp, so no Python-discovery dance is required.

name: Build Windows

on:
  workflow_dispatch:
    inputs:
      # Not a checkout target: nothing is checked out by this name — service runs
      # (no CI_COMMIT_TAG) publish no tag at all, so there would be nothing to
      # find under it. It names the run in the Actions UI and in the GitLab job
      # log.
      #
      # It is no longer ONLY a label, and saying so here would be a lie: since
      # §2.255 it is forwarded as CI_COMMIT_TAG (job env below) and therefore
      # decides whether check-release-vars.mjs REFUSES on a missing delivery
      # variable or merely warns. A manual dispatcher who types a
      # non-release-looking value gets the softer tier. That is bounded on
      # purpose — the GitLab trigger derives this from a verified tag, and a
      # manual Actions artifact is published by nothing (`publish` in
      # .gitlab-ci.yml is tag-only) — but it is a real property of this input,
      # not an implementation detail.
      tag:
        description: "Version tag / run id (e.g. v1.14.0). A vX.Y.Z value makes this a RELEASE build: missing delivery variables then stop the build instead of warning."
        required: true
        type: string
      # Sentry DSN is NOT a secret — it ships inside every client bundle by
      # design — so it travels as a plain dispatch input from the GitLab
      # trigger (scripts/trigger-github-build.sh). Empty is allowed: the build
      # step below falls back to the SENTRY_DSN repo secret for manual runs.
      sentry_dsn:
        description: "Sentry DSN baked into the bundle (plain value, not a secret)"
        required: false
        type: string
      # The electron-updater feed, baked into app-update.yml at package time.
      # Not a secret either — it ships inside every installer by design, exactly
      # like the DSN — so it travels the same way: a plain dispatch input from
      # scripts/trigger-github-build.sh. Empty NO LONGER falls back to a
      # placeholder (§2.255 hole (в) — that fallback is what shipped installers
      # unable to self-update). An empty value now reaches the guard step, which
      # refuses on every tier where this variable is required.
      update_url:
        description: "electron-updater feed URL baked into the installer"
        required: false
        type: string
        default: ""

# Least privilege for the run-scoped GITHUB_TOKEN. Without this block the token
# inherits the org/repo default, which may be the legacy read-write-all — far
# more than a build job needs, and flagged by CodeQL ("Workflow does not contain
# permissions").
#
# Why `contents: read` is the whole list — derived from what the steps below
# actually do, not from a template:
#   - actions/checkout@v4 reads the repository tree: needs contents: read.
#   - actions/setup-node@v4 passes github.token only to read the PUBLIC
#     actions/node-versions repo (see its action.yml `token` default); a public
#     read needs no extra scope.
#   - actions/upload-artifact@v4 does NOT use GITHUB_TOKEN at all. It talks to
#     the per-run Artifact service via ACTIONS_RUNTIME_TOKEN, which is granted by
#     the runner and is not governed by this block — so uploading needs no
#     `actions:` scope here.
#   - electron-builder runs with `--publish never`, so nothing is written back to
#     the repo, releases or packages.
# Nothing in this workflow writes to GitHub. Do not widen this block without a
# step that demonstrably fails on it; grant the narrowest missing scope instead
# of dropping the block.
permissions:
  contents: read

jobs:
  build:
    # Pinned to windows-2022, NOT windows-latest. windows-latest now resolves to
    # the windows-2025 image, where node-gyp (11.x) fails to detect the Visual
    # Studio C++ toolchain — "Could not find any Visual Studio installation to
    # use" — so the better-sqlite3 native rebuild (electron-builder
    # install-app-deps) aborts. windows-2022 ships VS 2022 with the C++ workload
    # that node-gyp reliably detects. Revisit if/when windows-2022 is retired
    # (then switch to an explicit MSVC setup step on windows-latest).
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      # electron-updater feed, baked into app-update.yml by electron-builder
      # (see the `publish.url` field in electron-builder.json5).
      #
      # §2.255 hole (в): the placeholder FALLBACK is gone. It is passed through
      # verbatim now, and an empty value is refused by the guard step below
      # rather than silently replaced. History of why that matters:
      # It used to be the only value here, with a comment claiming it was
      # "overridden in production" — nothing overrode it, because the GitLab
      # trigger never sent one. Every Windows and macOS installer therefore
      # shipped pointing at `placeholder.local`, so "check for updates"
      # failed DNS resolution and surfaced as "network error — try again when
      # you're online", and background update checks failed the same way.
      # Verified on the released 1.23.0 installer, not inferred: its
      # app-update.yml carried the placeholder. Linux was never affected — its
      # value comes from the CI variable in .gitlab-ci.yml.
      MAILCOPILOT_UPDATE_URL: ${{ inputs.update_url }}

      # §2.255 — everything the release guard and the build both need lives at
      # JOB level, so the guard step below judges the exact values the build
      # will bake. Declaring them per-step let the guard pass on an env the
      # build never saw.
      #
      # CI_COMMIT_TAG is forwarded verbatim from the dispatch. It is the only
      # way this runner can know whether it is building a release: the variable
      # is GitLab-only and is never set here, so before this line the guard
      # classified EVERY dispatch — including a genuine vX.Y.Z release — as a
      # nightly, and silently degraded the OAuth pair from "refuse" to "warn".
      # That is the very failure shape §2.255 exists to remove, reproduced by
      # the fix for it (found by pre-pr-gate, 2026-08-27).
      #
      # No new signal is invented and the guard is unchanged: a service run's
      # tag (`v1.26.0-nightly.1-dev.<stamp>`) does not match the guard's
      # anchored `^v\d+\.\d+\.\d+$`, so it still classifies as nightly on
      # its own. Only a real release tag reads as a release.
      CI_COMMIT_TAG: ${{ inputs.tag }}

      # Gmail sign-in must work in the Windows and macOS installers, and before
      # this it could not: these two were never forwarded anywhere, so
      # vite.config.ts baked empty strings and every installer shipped with the
      # Google provider unavailable. Not the 1.25.1 failure (a present ID with
      # an empty secret) — worse in a quieter way, absent on both platforms
      # since these builds existed.
      #
      # Repo SECRETS, not dispatch inputs, unlike sentry_dsn/update_url. Those
      # two are public by design and ship in every artifact regardless; the
      # OAuth client secret also ships in the binary (a Desktop client's secret
      # is not confidential in the OAuth sense — PKCE is what protects the
      # exchange), but a dispatch input is ALSO printed in this public mirror's
      # Actions UI, which is a second, needless place for it to live. Secrets
      # are created by hand on the mirror; scripts/mirror-github.sh recreates
      # the repository and never carries them.
      #
      # ACCEPTED TRADE-OFF, stated because the file argues the opposite about
      # SENTRY_AUTH_TOKEN a few lines down. Job-level env is visible to EVERY
      # step, including `npm ci` lifecycle scripts of a checked-out ref that a
      # dispatcher chose — so a malicious ref could read these. It is accepted
      # here and not for the Sentry token because the two differ in what leaks:
      # a Desktop OAuth client secret already ships inside every installer (PKCE
      # is what protects the exchange), while SENTRY_AUTH_TOKEN would grant
      # write access to our Sentry org and ships nowhere.
      #
      # The alternative — declaring the pair on the guard step and the build
      # step instead — was rejected: it creates two copies that drift, which is
      # exactly the "guard judged one environment, build baked another" defect
      # this file was corrected for twice. Narrowing exposure by reopening that
      # gap is a bad trade. The real fix is a protected GitHub Environment that
      # only materialises secrets for approved refs; that needs repository
      # configuration, so it is a followup (BACKLOG §2.255.f1), not a silent
      # weakening here.
      MAILCOPILOT_GOOGLE_CLIENT_ID: ${{ secrets.MAILCOPILOT_GOOGLE_CLIENT_ID }}
      MAILCOPILOT_GOOGLE_CLIENT_SECRET: ${{ secrets.MAILCOPILOT_GOOGLE_CLIENT_SECRET }}

      # vite.config.ts bakes __SENTRY_DSN__ from SENTRY_DSN at `vite build` time.
      # Without it the bundled SDK starts with enabled:false and the release
      # ships a silent zero of telemetry (the DSN-first lesson: always confirm
      # the DSN reaches the bundle before touching capture code).
      #
      # Declared at job level rather than on the build step so the §2.255 guard
      # below reads the same value the build bakes — a guard that reads a
      # different environment than the build is the defect class this file was
      # already fixed for twice. Priority unchanged: dispatch input from the
      # GitLab trigger, else the repo secret for manual runs (secrets are created
      # by hand on the mirror; scripts/mirror-github.sh recreates the repository
      # and never carries them).
      SENTRY_DSN: ${{ inputs.sentry_dsn != '' && inputs.sentry_dsn || secrets.SENTRY_DSN }}

    steps:
      # Builds the commit this run was dispatched on, and nothing else.
      # `github.sha` for a workflow_dispatch is the head of the dispatched ref,
      # and it is the same value as the run's `head_sha` — which is what
      # scripts/trigger-github-build.sh matches on when it picks its run and
      # re-checks before downloading the artifact. So "the commit that was
      # verified" and "the commit that was built" are one object, not two values
      # that could disagree. Do NOT reintroduce an input for this: an input is not
      # covered by head_sha, so a second dispatch on the same branch would pass
      # both guards while building something else.
      - name: Checkout the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release delivery variables (§2.255)
        run: node scripts/check-release-vars.mjs

      # Every variable this step needs is declared at job level above, so there
      # is no step-level `env:` here — see the SENTRY_DSN comment there for why.
      #
      # Sourcemap upload is intentionally NOT wired in. This step executes
      # vite.config.ts from an arbitrary workflow_dispatch ref (anyone able to
      # dispatch chooses the ref, and the checkout above follows it), so
      # attaching SENTRY_AUTH_TOKEN would let a malicious ref exfiltrate the
      # token. vite.config.ts gates the upload on SENTRY_AUTH_TOKEN && SENTRY_DSN
      # both being set, so without the token the upload is skipped and the build
      # still passes. Wire it later via a protected GitHub Environment (required
      # reviewers) or a separate trusted upload step.
      - name: Build (typecheck + bundle + package)
        run: |
          npx tsc
          npx vite build
          npx electron-builder --win nsis --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 7
          if-no-files-found: error
